[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffweave"
version = "0.1.0"
description = "A Git-like developer platform for DocWeave document intelligence"
authors = [{ name = "DocWeave Team" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.scripts]
dw = "diffweave.cli.main:app"
diffweave = "diffweave.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["diffweave*"]
